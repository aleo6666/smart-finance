# Smart Finance - 生产环境覆盖配置
# 用法: docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  mysql:
    # 1.6G 小内存: 限制 MySQL 内存上限，配置小 buffer pool
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --innodb-flush-method=O_DIRECT
      --performance-schema=OFF
      --skip-log-bin
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M

  redis:
    # 注意: 该镜像无 ENTRYPOINT, command 会绕过 /entrypoint.sh(导致模块不加载)!
    # 正确姿势: 用 REDIS_ARGS 环境变量, entrypoint 内部拼接:
    #   redis-server /redis-stack.conf --protected-mode no --loadmodule ... ${REDIS_ARGS}
    # --save 60 1: RDB 快照, checkpoint 持久化跨容器重启
    environment:
      REDIS_ARGS: "--maxmemory 128mb --maxmemory-policy allkeys-lru --save 60 1"
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M

  qdrant:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  backend:
    environment:
      # 生产模式信任前端代理的 X-Forwarded-* 头
      NODE_ENV: production
      TRUST_PROXY: "true"
    deploy:
      resources:
        limits:
          memory: 350M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  qdrant_data:
  backend_uploads:
