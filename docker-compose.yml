services:
  mysql:
    image: mysql:8.4
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smart_finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-FinancePass2026!}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-FinanceRoot2026!}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./server/finance.db:/app/finance.db:ro
      - backend_uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:-FinancePass2026!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VECTOR_DB_URL: http://qdrant:6333
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-finance_records}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-random-64-char-string-xxxxxxxxxxxxxxxx}
      UPLOADS_DIR: /app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  qdrant_data:
  backend_uploads:
