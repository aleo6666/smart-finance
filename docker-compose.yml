services:
  mysql:
    image: mysql:8.4
    container_name: finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smart_finance}
      MYSQL_USER: ${DB_USER:-finance}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u$${MYSQL_USER} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: finance-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-smart_finance}
      DB_USER: ${DB_USER:-finance}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VECTOR_DB_URL: http://qdrant:6333
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-}
      LM_STUDIO_CHAT_MODEL: ${LM_STUDIO_CHAT_MODEL:-qwen3.6-35b-a3b}
      LM_STUDIO_EMBEDDING_MODEL: ${LM_STUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      LM_STUDIO_EMBEDDING_TIMEOUT_MS: ${LM_STUDIO_EMBEDDING_TIMEOUT_MS:-10000}
      LM_STUDIO_CHAT_TIMEOUT_MS: ${LM_STUDIO_CHAT_TIMEOUT_MS:-120000}
      LM_STUDIO_LIST_MODELS_TIMEOUT_MS: ${LM_STUDIO_LIST_MODELS_TIMEOUT_MS:-5000}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_COLLECTION: ${RAG_COLLECTION:-finance_records_nomic_v1}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENABLE_LANGGRAPH_AGENT: ${ENABLE_LANGGRAPH_AGENT:-false}
      ENABLE_FOUR_LAYER_MEMORY: ${ENABLE_FOUR_LAYER_MEMORY:-false}
      ENABLE_ADMIN_SQL_AGENT: ${ENABLE_ADMIN_SQL_AGENT:-false}
      ENABLE_PADDLE_OCR: ${ENABLE_PADDLE_OCR:-false}
      ENABLE_QDRANT_KNOWLEDGE: ${ENABLE_QDRANT_KNOWLEDGE:-false}
      ENABLE_BILL_VECTOR_WRITE: ${ENABLE_BILL_VECTOR_WRITE:-false}
      LANGGRAPH_ROLLOUT_PERCENT: ${LANGGRAPH_ROLLOUT_PERCENT:-0}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-5}
      AGENT_GRAPH_RECURSION_LIMIT: ${AGENT_GRAPH_RECURSION_LIMIT:-12}
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-120000}
      AGENT_NETWORK_RETRY_COUNT: ${AGENT_NETWORK_RETRY_COUNT:-2}
      AGENT_DATASET_TTL_SECONDS: ${AGENT_DATASET_TTL_SECONDS:-300}
      AGENT_CONFIRMATION_TTL_SECONDS: ${AGENT_CONFIRMATION_TTL_SECONDS:-1800}
      MEMORY_WINDOW_MAX_MESSAGES: ${MEMORY_WINDOW_MAX_MESSAGES:-10}
      MEMORY_WINDOW_MAX_TOKENS: ${MEMORY_WINDOW_MAX_TOKENS:-4000}
      MEMORY_SESSION_TTL_SECONDS: ${MEMORY_SESSION_TTL_SECONDS:-1800}
      MEMORY_SUMMARY_TRIGGER_MESSAGES: ${MEMORY_SUMMARY_TRIGGER_MESSAGES:-12}
      MEMORY_SUMMARY_RETENTION_DAYS: ${MEMORY_SUMMARY_RETENTION_DAYS:-30}
      ADMIN_SQL_HOST: ${ADMIN_SQL_HOST:-mysql}
      ADMIN_SQL_PORT: ${ADMIN_SQL_PORT:-3306}
      ADMIN_SQL_DB_NAME: ${ADMIN_SQL_DB_NAME:-smart_finance}
      ADMIN_SQL_DB_USER: ${ADMIN_SQL_DB_USER:-}
      ADMIN_SQL_DB_PASSWORD: ${ADMIN_SQL_DB_PASSWORD:-}
      ADMIN_SQL_MAX_ROWS: ${ADMIN_SQL_MAX_ROWS:-200}
      ADMIN_SQL_TIMEOUT_MS: ${ADMIN_SQL_TIMEOUT_MS:-3000}
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_ACCESS_TOKEN:-}
      PADDLEOCR_REQUEST_TIMEOUT_MS: ${PADDLEOCR_REQUEST_TIMEOUT_MS:-300000}
      PADDLEOCR_POLL_TIMEOUT_MS: ${PADDLEOCR_POLL_TIMEOUT_MS:-600000}
      JWT_SECRET: ${JWT_SECRET:-}
      UPLOADS_DIR: /app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  qdrant_data:
  backend_uploads:

